{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Google Maps API Script -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{ template_data.GOOGLE_MAPS_API_KEY }}&callback=initMap"></script>

<div class="container-fluid p-0">
    <div class="row">
        <!-- Map Container -->
        <div class="col-12">
            <div class="card shadow mb-4">
                <div class="card-header bg-dark text-white">
                    <h3 class="mb-0">
                        <i class="fas fa-map-marked-alt me-2"></i>
                        Jobs Map
                    </h3>
                    <p class="mb-0 mt-2">Click on office locations to see available jobs</p>
                    <div class="mt-2">
                        <button id="findNearMeBtn" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-location-arrow me-1"></i>
                            Find Jobs Near Me
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="map" style="height: 600px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Jobs Modal -->
<div class="modal fade" id="jobsModal" tabindex="-1" aria-labelledby="jobsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="jobsModalLabel">
                    <i class="fas fa-building me-2"></i>
                    Available Jobs
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="jobsContent">
                    <!-- Content will be populated by JavaScript -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
// Map data from Django
const officeData = {{ template_data.office_data|safe }};
const apiKey = '{{ template_data.GOOGLE_MAPS_API_KEY }}';

let map;
let markers = [];
let userLocationMarker = null;

function initMap() {
    console.log('initMap function called');
    try {
        // Initialize the map centered on the US
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 4,
            center: { lat: 39.8283, lng: -98.5795 }, // Center of US
            mapTypeId: google.maps.MapTypeId.ROADMAP,
            styles: [
                {
                    featureType: "administrative.country",
                    elementType: "geometry.stroke",
                    stylers: [{ color: "#000000" }, { weight: 1 }]
                }
            ]
        });
        console.log('Google Maps initialized successfully');
    } catch (error) {
        console.error('Error initializing Google Maps:', error);
        document.getElementById('map').innerHTML = `
            <div class="d-flex align-items-center justify-content-center h-100 bg-danger text-white">
                <div class="text-center">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                    <h5>Google Maps Error</h5>
                    <p>Error: ${error.message}</p>
                </div>
            </div>
        `;
        return;
    }

    // Add markers for office locations
    officeData.forEach(office => {
        const marker = new google.maps.Marker({
            position: { lat: office.latitude, lng: office.longitude },
            map: map,
            title: `${office.company_name} - ${office.job_count} job(s) available`,
            icon: {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                    <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="16" fill="#007bff" stroke="#ffffff" stroke-width="2"/>
                        <text x="20" y="26" text-anchor="middle" fill="white" font-size="12" font-weight="bold">${office.job_count}</text>
                    </svg>
                `),
                scaledSize: new google.maps.Size(40, 40),
                anchor: new google.maps.Point(20, 20)
            }
        });

        // Add click listener
        marker.addListener('click', function() {
            showJobsAtOffice(office);
        });

        markers.push(marker);
    });
}

function showJobsAtOffice(office) {
    // Update modal title
    document.getElementById('jobsModalLabel').innerHTML = 
        `<i class="fas fa-building me-2"></i>Jobs at ${office.company_name}`;
    
    // Build content
    let content = '';
    
    if (office.jobs.length === 0) {
        content = `
            <div class="text-center py-4">
                <i class="fas fa-info-circle fa-3x text-muted mb-3"></i>
                <h5 class="text-muted">No jobs available</h5>
                <p class="text-muted">No published jobs are currently available at this location.</p>
            </div>
        `;
    } else {
        content = `
            <div class="mb-3">
                <h6><i class="fas fa-map-marker-alt me-2"></i>Location</h6>
                <p class="text-muted mb-0">${office.address}</p>
                ${office.city ? `<p class="text-muted mb-0">${office.city}${office.state ? ', ' + office.state : ''}${office.country ? ', ' + office.country : ''}</p>` : ''}
            </div>
            <hr>
            <h6><i class="fas fa-briefcase me-2"></i>Available Jobs (${office.jobs.length})</h6>
            <div class="row">
        `;
        
        office.jobs.forEach(job => {
            const salaryText = job.salary_min && job.salary_max ? 
                `${job.currency} ${job.salary_min.toLocaleString()} - ${job.salary_max.toLocaleString()}` :
                job.salary_min ? `${job.currency} ${job.salary_min.toLocaleString()}+` :
                job.salary_max ? `Up to ${job.currency} ${job.salary_max.toLocaleString()}` :
                'Salary not specified';
            
            content += `
                <div class="col-md-6 mb-3">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="card-title">${job.title}</h6>
                            <p class="card-text small text-muted mb-2">
                                <span class="badge bg-primary me-1">${job.employment_type}</span>
                                <span class="badge bg-secondary me-1">${job.work_mode}</span>
                            </p>
                            <p class="card-text small text-success mb-2">
                                <i class="fas fa-dollar-sign me-1"></i>${salaryText}
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <a href="${job.url}" class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-eye me-1"></i>View Details
                                </a>
                                ${job.has_applied ? 
                                    '<span class="badge bg-success">Applied</span>' :
                                    '<a href="' + job.url + '#apply" class="btn btn-success btn-sm"><i class="fas fa-paper-plane me-1"></i>Apply</a>'
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        content += '</div>';
    }
    
    document.getElementById('jobsContent').innerHTML = content;
    
    // Show modal
    const modal = new bootstrap.Modal(document.getElementById('jobsModal'));
    modal.show();
}

// Find jobs near me functionality
document.getElementById('findNearMeBtn').addEventListener('click', function() {
    if (navigator.geolocation) {
        this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Finding location...';
        this.disabled = true;
        
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                
                // Center map on user location
                map.setCenter({ lat: userLat, lng: userLng });
                map.setZoom(10);
                
                // Add user location marker
                if (userLocationMarker) {
                    userLocationMarker.setMap(null);
                }
                
                userLocationMarker = new google.maps.Marker({
                    position: { lat: userLat, lng: userLng },
                    map: map,
                    title: 'Your Location',
                    icon: {
                        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                            <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="15" cy="15" r="12" fill="#28a745" stroke="#ffffff" stroke-width="2"/>
                                <text x="15" y="20" text-anchor="middle" fill="white" font-size="12" font-weight="bold">📍</text>
                            </svg>
                        `),
                        scaledSize: new google.maps.Size(30, 30),
                        anchor: new google.maps.Point(15, 15)
                    }
                });
                
                // Reset button
                document.getElementById('findNearMeBtn').innerHTML = '<i class="fas fa-location-arrow me-1"></i>Find Jobs Near Me';
                document.getElementById('findNearMeBtn').disabled = false;
            },
            function(error) {
                console.error('Geolocation error:', error);
                alert('Unable to get your location. Please check your browser settings.');
                
                // Reset button
                document.getElementById('findNearMeBtn').innerHTML = '<i class="fas fa-location-arrow me-1"></i>Find Jobs Near Me';
                document.getElementById('findNearMeBtn').disabled = false;
            }
        );
    } else {
        alert('Geolocation is not supported by this browser.');
    }
});

// Initialize map when page loads
document.addEventListener('DOMContentLoaded', function() {
    // Check if Google Maps API key is available
    console.log('API Key:', apiKey);
    console.log('API Key length:', apiKey.length);
    
    if (!apiKey || apiKey.length < 10) {
        document.getElementById('map').innerHTML = `
            <div class="d-flex align-items-center justify-content-center h-100 bg-light">
                <div class="text-center">
                    <i class="fas fa-map fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">Google Maps API Key Required</h5>
                    <p class="text-muted">Please configure the GOOGLE_MAPS_API_KEY environment variable</p>
                    <p class="text-muted">Current API Key: ${apiKey}</p>
                </div>
            </div>
        `;
    } else {
        // Show loading message
        document.getElementById('map').innerHTML = `
            <div class="d-flex align-items-center justify-content-center h-100 bg-light">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin fa-3x text-primary mb-3"></i>
                    <h5 class="text-primary">Loading Google Maps...</h5>
                    <p class="text-muted">API Key: ${apiKey.substring(0, 10)}...</p>
                </div>
            </div>
        `;
        
        // Set a timeout to show error if Google Maps doesn't load
        setTimeout(function() {
            if (typeof google === 'undefined' || !google.maps) {
                document.getElementById('map').innerHTML = `
                    <div class="d-flex align-items-center justify-content-center h-100 bg-warning">
                        <div class="text-center">
                            <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                            <h5 class="text-warning">Google Maps Failed to Load</h5>
                            <p class="text-muted">Please check your API key restrictions in Google Cloud Console</p>
                            <p class="text-muted">Make sure localhost:8000 is added to HTTP referrers</p>
                        </div>
                    </div>
                `;
            }
        }, 5000); // 5 second timeout
    }
    // If API key is available, the initMap function will be called by Google Maps API
});
</script>
{% endblock content %}
