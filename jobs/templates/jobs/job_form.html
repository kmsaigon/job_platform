{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <h2>{{ form.instance.pk|yesno:"Edit job,Create job" }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-secondary" href="{% url 'jobs:my_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock content %}
